<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Master App Canvas: Deep Royal Blue & Cobalt Obsidian Gradient -->
    <linearGradient id="luxuryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="30%" stop-color="#1e1b4b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Top Left Glass Sheen Highlight -->
    <linearGradient id="topHighlight" x1="0%" y1="0%" x2="70%" y2="70%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Outer Rim Edge Glow -->
    <linearGradient id="rimStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.5" />
    </linearGradient>

    <!-- Silk Parchment Document Surface -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Paper Corner Fold Metal Gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Electric Cyan Scanner Laser Beam -->
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="25%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="75%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <!-- Royal Cobalt PDF Emblem -->
    <linearGradient id="pdfPillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <!-- 24K Liquid Gold Sparkle Star -->
    <linearGradient id="pureGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Drop Shadows for 3D realism -->
    <filter id="docShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-opacity="0.55" flood-color="#000000" />
    </filter>
    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.4" flood-color="#020617" />
    </filter>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.5" flood-color="#f59e0b" />
    </filter>
  </defs>

  <!-- iOS Master Squircle (Continuous Curvature Corner radius 116) -->
  <rect width="512" height="512" rx="116" fill="url(#luxuryBg)" />
  <!-- Glass Reflection Upper Arc -->
  <rect width="512" height="256" rx="116" fill="url(#topHighlight)" />
  <!-- Inner Rim Precision Stroke -->
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="url(#rimStroke)" stroke-width="2.5" />

  <!-- Layer 1: Background Document (Depth & Stack Effect) -->
  <g opacity="0.35" transform="translate(18, -12)">
    <rect x="136" y="86" width="240" height="340" rx="22" fill="#64748b" />
  </g>

  <!-- Layer 2: Main Silk Document -->
  <g filter="url(#docShadow)">
    <!-- Base Page Cut with Folded Top Right Corner -->
    <path d="M 134 88 C 134 74 145 62 158 62 L 302 62 L 378 138 L 378 424 C 378 438 145 450 158 450 L 158 450 C 145 450 134 438 134 424 Z" fill="url(#paperGrad)" />
    <!-- Fold Flap -->
    <path d="M 302 62 L 302 126 C 302 132.6 307.4 138 314 138 L 378 138 Z" fill="url(#foldGrad)" />
    <path d="M 302 62 L 378 138 Z" stroke="#64748b" stroke-width="1" opacity="0.4" />
  </g>

  <!-- Document Graphic Layout: Camera / Scanner Lens Graphic -->
  <g transform="translate(256, 230)">
    <!-- Scanner Aperture Circle -->
    <circle cx="0" cy="0" r="54" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />
    <circle cx="0" cy="0" r="44" fill="#0f172a" />
    <circle cx="0" cy="0" r="40" fill="url(#luxuryBg)" />

    <!-- Camera / Document Lens Icon -->
    <!-- Mountain/Image silhouette -->
    <path d="M -22 18 L -6 -2 C -4 -5 0 -5 2 -2 L 18 18 Z" fill="#38bdf8" opacity="0.9" />
    <path d="M 4 18 L 12 8 C 13.5 6 16.5 6 18 8 L 26 18 Z" fill="#60a5fa" opacity="0.8" />
    <!-- Golden Sun in Aperture -->
    <circle cx="10" cy="-14" r="6" fill="url(#pureGold)" />

    <!-- Lens Glass Reflection -->
    <path d="M -24 -20 A 34 34 0 0 1 20 -24 A 36 36 0 0 0 -24 -20 Z" fill="#ffffff" opacity="0.3" />
  </g>

  <!-- Laser Beam across document (Instant Scan Effect) -->
  <rect x="144" y="228" width="224" height="4" rx="2" fill="url(#laserBeam)" />
  <circle cx="256" cy="230" r="3" fill="#ffffff" />

  <!-- Document Header Lines (Minimalist Typography Placeholder) -->
  <rect x="168" y="104" width="72" height="7" rx="3.5" fill="#3b82f6" />
  <rect x="168" y="120" width="104" height="5" rx="2.5" fill="#94a3b8" opacity="0.8" />

  <!-- 3D Embossed Premium PDF Pill Badge -->
  <g filter="url(#pillShadow)">
    <rect x="140" y="340" width="232" height="72" rx="20" fill="url(#pdfPillGrad)" />
    <!-- High-gloss top chamfer highlight line -->
    <rect x="148" y="343" width="216" height="2.5" rx="1.25" fill="#ffffff" opacity="0.45" />
    <!-- Inner Rim Stroke -->
    <rect x="141" y="341" width="230" height="70" rx="19" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.6" />

    <!-- Bold Sharp SF / Apple Style 'PDF' Typography -->
    <text x="256" y="390" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, sans-serif" font-weight="900" font-size="36" text-anchor="middle" letter-spacing="3">PDF</text>
  </g>

  <!-- Floating 24K Liquid Gold Star Emblem (Top Right) -->
  <g transform="translate(398, 76)" filter="url(#goldGlow)">
    <circle cx="0" cy="0" r="26" fill="url(#pureGold)" stroke="#ffffff" stroke-width="3" />
    <!-- 8-Point Diamond Sparkle Star -->
    <path d="M 0 -14 L 3.5 -3.5 L 14 0 L 3.5 3.5 L 0 14 L -3.5 3.5 L -14 0 L -3.5 -3.5 Z" fill="#ffffff" />
    <circle cx="0" cy="0" r="2.5" fill="#fef08a" />
  </g>
</svg>
